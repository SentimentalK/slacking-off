[workspace]
resolver = "2"
members = ["crates/proto", "crates/core", "crates/server", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[workspace.dependencies]
loo-proto = { path = "crates/proto" }
loo-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled"] }
ureq = { version = "2", features = ["json"] }

[profile.release]
lto = "thin"
