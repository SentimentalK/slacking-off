<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>带薪拉屎 · 林地原型</title>
<style>

  canvas{display:block;width:100vw;height:100vh;cursor:pointer}
  #vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 52%,rgba(6,10,6,.62) 100%)}
  .panel{position:fixed;background:rgba(20,24,22,.78);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.55;backdrop-filter:blur(3px)}
  #hud{left:12px;top:12px;max-width:290px}
  #hud h1{margin:0 0 4px;font-size:16px;color:#ffcf40}
  .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  button{background:rgba(255,255,255,.1);color:#f4f1e8;border:1.5px solid rgba(255,255,255,.22);border-radius:8px;padding:5px 9px;font:inherit;cursor:pointer}
  button.on{border-color:#ffcf40;color:#ffcf40}
  #tip{left:12px;bottom:12px;max-width:540px}
  #log{right:12px;top:12px;min-width:210px;max-width:270px;font-size:12px}
  #log b{color:#ffcf40}
</style>
</head>
<body>
<div id="vig"></div>
<div id="hud" class="panel">
  <h1>带薪拉屎 · Company Time</h1>
  <div>林地原型：暗一些的写实卡通、厚草、层叠松树、强光长影。</div>
  <div class="row">
    <button id="bDusk">黄昏</button>
    <button id="bView">换视角</button>
    <button id="bRoof">屋顶：自动</button>
    <button id="bGrid">网格</button>
  </div>
</div>
<div id="log" class="panel"><b>现场</b><div id="logBody">—</div></div>
<div id="tip" class="panel">
  点地面：白色的鸭子机器人走过去，一格一个回合（方向键 / WASD 也行）。滚轮缩放。<br>
  点一面墙：拆掉 / 重建。点门：开 / 关。鼠标移到棚屋上：屋顶淡出。<br>
  左上的棚屋有人在用；拆它一面墙试试。
</div>
