<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>战报分享卡</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Noto+Sans+SC:wght@400;500;700;900&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ffcf40}a:hover{color:#fff3b0}
</style>
</head>
<body style="background:#141926">
<div style="width: 1200px; height: 630px; box-sizing: border-box; padding: 48px; display: flex; gap: 48px; align-items: center; background: #1d2433; color: #f4f1e8; font-family: 'Noto Sans SC', system-ui, sans-serif">

<svg width="480" height="480" viewBox="0 0 48 48" role="img" aria-label="一只黄色小猫机器人坐在黄金马桶上，一脸舒坦" style="flex-shrink: 0; shape-rendering: crispEdges; box-shadow: 0 0 0 6px #2b2233, 0 12px 0 6px #141926">
<defs>
<pattern id="sc-floor" width="32" height="32" patternUnits="userSpaceOnUse">
<rect width="32" height="32" fill="#e4efe9"></rect>
<rect x="16" y="0" width="16" height="16" fill="#d3e4dc"></rect>
<rect x="0" y="16" width="16" height="16" fill="#d3e4dc"></rect>
<rect x="0" y="15" width="32" height="1" fill="#c3d6cd"></rect>
<rect x="0" y="31" width="32" height="1" fill="#c3d6cd"></rect>
<rect x="15" y="0" width="1" height="32" fill="#c3d6cd"></rect>
<rect x="31" y="0" width="1" height="32" fill="#c3d6cd"></rect>
</pattern>
<symbol id="sc-w" viewBox="0 0 16 16">
<rect width="16" height="11" fill="#aebbd8"></rect>
<rect width="16" height="1" fill="#cdd6ea"></rect>
<rect y="11" width="16" height="5" fill="#7384ad"></rect>
<rect y="11" width="16" height="1" fill="#8c9cc4"></rect>
<rect y="15" width="16" height="1" fill="#55648a"></rect>
</symbol>
<symbol id="sc-dc" viewBox="0 0 16 16">
<rect width="16" height="11" fill="#f2b86c"></rect>
<rect width="16" height="1" fill="#f9d49a"></rect>
<rect x="7" y="1" width="2" height="10" fill="#dfa055"></rect>
<rect y="11" width="16" height="5" fill="#c47a30"></rect>
<rect y="15" width="16" height="1" fill="#8f5720"></rect>
<rect x="0" y="0" width="1" height="16" fill="#7384ad"></rect>
<rect x="15" y="0" width="1" height="16" fill="#7384ad"></rect>
<rect x="5" y="12" width="6" height="3" fill="#ffffff"></rect>
<rect x="6" y="13" width="4" height="1" fill="#e5484d"></rect>
</symbol>
<symbol id="sc-t5" viewBox="0 0 16 16">
<rect x="3" y="0" width="10" height="16" fill="#2b2233"></rect>
<rect x="4" y="1" width="8" height="4" fill="#ffcf40"></rect>
<rect x="4" y="4" width="8" height="1" fill="#d99a1e"></rect>
<rect x="7" y="2" width="2" height="1" fill="#fff3b0"></rect>
<rect x="4" y="1" width="1" height="2" fill="#fff3b0"></rect>
<rect x="4" y="6" width="8" height="9" fill="#ffcf40"></rect>
<rect x="4" y="6" width="1" height="4" fill="#fff3b0"></rect>
<rect x="4" y="14" width="8" height="1" fill="#d99a1e"></rect>
</symbol>
<symbol id="sc-bot" viewBox="0 0 16 16">
<rect x="2" y="0" width="4" height="3" fill="#2b2233"></rect>
<rect x="10" y="0" width="4" height="3" fill="#2b2233"></rect>
<rect x="2" y="2" width="12" height="9" fill="#2b2233"></rect>
<rect x="4" y="11" width="8" height="4" fill="#2b2233"></rect>
<rect x="3" y="1" width="2" height="2" fill="currentColor"></rect>
<rect x="11" y="1" width="2" height="2" fill="currentColor"></rect>
<rect x="3" y="3" width="10" height="7" fill="currentColor"></rect>
<rect x="5" y="11" width="6" height="3" fill="currentColor"></rect>
<rect x="12" y="12" width="2" height="1" fill="currentColor"></rect>
<rect x="13" y="10" width="1" height="2" fill="currentColor"></rect>
<rect x="3" y="3" width="10" height="1" fill="#ffffff" opacity=".3"></rect>
<rect x="3" y="9" width="10" height="1" fill="#000000" opacity=".2"></rect>
<rect x="5" y="13" width="6" height="1" fill="#000000" opacity=".2"></rect>
<rect x="4" y="4" width="8" height="5" fill="#1d2433"></rect>
<rect x="7" y="12" width="2" height="1" fill="#7df9ff"></rect>
<rect x="5" y="6" width="1" height="1" fill="#9dffb0"></rect>
<rect x="6" y="5" width="1" height="1" fill="#9dffb0"></rect>
<rect x="7" y="6" width="1" height="1" fill="#9dffb0"></rect>
<rect x="9" y="6" width="1" height="1" fill="#9dffb0"></rect>
<rect x="10" y="5" width="1" height="1" fill="#9dffb0"></rect>
<rect x="11" y="6" width="1" height="1" fill="#9dffb0"></rect>
<rect x="7" y="8" width="2" height="1" fill="#9dffb0"></rect>
</symbol>
<symbol id="sc-sit" viewBox="0 0 16 16">
<g transform="translate(0,5)">
<rect x="2" y="0" width="4" height="3" fill="#2b2233"></rect>
<rect x="10" y="0" width="4" height="3" fill="#2b2233"></rect>
<rect x="2" y="2" width="12" height="9" fill="#2b2233"></rect>
<rect x="3" y="1" width="2" height="2" fill="currentColor"></rect>
<rect x="11" y="1" width="2" height="2" fill="currentColor"></rect>
<rect x="3" y="3" width="10" height="7" fill="currentColor"></rect>
<rect x="3" y="3" width="10" height="1" fill="#ffffff" opacity=".3"></rect>
<rect x="3" y="9" width="10" height="1" fill="#000000" opacity=".2"></rect>
<rect x="4" y="4" width="8" height="5" fill="#1d2433"></rect>
<rect x="5" y="6" width="1" height="1" fill="#9dffb0"></rect>
<rect x="6" y="5" width="1" height="1" fill="#9dffb0"></rect>
<rect x="7" y="6" width="1" height="1" fill="#9dffb0"></rect>
<rect x="9" y="6" width="1" height="1" fill="#9dffb0"></rect>
<rect x="10" y="5" width="1" height="1" fill="#9dffb0"></rect>
<rect x="11" y="6" width="1" height="1" fill="#9dffb0"></rect>
<rect x="7" y="8" width="2" height="1" fill="#9dffb0"></rect>
</g>
</symbol>
<symbol id="sc-sp" viewBox="0 0 5 5">
<rect x="2" y="0" width="1" height="5" fill="#fff3b0"></rect>
<rect x="0" y="2" width="5" height="1" fill="#fff3b0"></rect>
</symbol>
</defs>
<rect width="48" height="48" fill="url(#sc-floor)"></rect>
<use href="#sc-w" x="16" y="0" width="16" height="16"></use>
<use href="#sc-w" x="0" y="16" width="16" height="16"></use>
<use href="#sc-w" x="32" y="16" width="16" height="16"></use>
<use href="#sc-t5" x="16" y="16" width="16" height="16"></use>
<g style="color: #42a5f5"><use href="#sc-sit" x="16" y="16" width="16" height="16"></use></g>
<use href="#sc-dc" x="16" y="32" width="16" height="16"></use>
<use href="#sc-sp" x="12" y="13" width="5" height="5"></use>
<use href="#sc-sp" x="31" y="17" width="5" height="5"></use>
<use href="#sc-sp" x="29" y="10" width="3" height="3"></use>
<use href="#sc-sp" x="14" y="26" width="3" height="3"></use>
</svg>

<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-family: 'Silkscreen', monospace; font-size: 34px; line-height: 1.1; color: #ffcf40">mochi-7</div>
<div style="font-family: 'ZCOOL QingKe HuangYou', 'Noto Sans SC', sans-serif; font-size: 84px; line-height: 1.05">带薪拉屎成功</div>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<div style="background: #2b3550; border: 3px solid #3b4a6b; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px"><div style="font-size: 16px; color: #aab3c5">得分</div><div style="font-family: 'Silkscreen', monospace; font-size: 30px; color: #ffcf40">+1,280</div></div>
<div style="background: #2b3550; border: 3px solid #3b4a6b; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px"><div style="font-size: 16px; color: #aab3c5">用时</div><div style="font-family: 'Silkscreen', monospace; font-size: 30px">04:12</div></div>
<div style="background: #2b3550; border: 3px solid #3b4a6b; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px"><div style="font-size: 16px; color: #aab3c5">马桶</div><div style="font-size: 28px; font-weight: 900; line-height: 1.2; color: #ffcf40">黄金</div></div>
<div style="background: #2b3550; border: 3px solid #3b4a6b; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px"><div style="font-size: 16px; color: #aab3c5">挨揍</div><div style="font-size: 28px; font-weight: 900; line-height: 1.2">2 次</div></div>
<div style="background: #2b3550; border: 3px solid #3b4a6b; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px"><div style="font-size: 16px; color: #aab3c5">防住</div><div style="font-size: 28px; font-weight: 900; line-height: 1.2">1 次</div></div>
<div style="background: #3a2f12; border: 3px solid #b57f10; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px"><div style="font-size: 16px; color: #e6c97a">来由</div><div style="font-size: 28px; font-weight: 900; line-height: 1.2; color: #ffcf40">摸鱼</div></div>
</div>

<div style="font-size: 22px; line-height: 1.5; color: #d7dbe6">“测试套件要跑十分钟，我出来一下。”</div>

<div style="display: flex; align-items: baseline; gap: 14px; padding-top: 14px; border-top: 3px solid #3b4a6b">
<div style="font-family: 'ZCOOL QingKe HuangYou', 'Noto Sans SC', sans-serif; font-size: 26px; color: #ffcf40">带薪拉屎</div>
<div style="font-family: 'Silkscreen', monospace; font-size: 16px; color: #aab3c5">COMPANY TIME</div>
<div style="flex-grow: 1"></div>
<div style="font-size: 16px; color: #aab3c5">自报型号 quartz-mini · [你的域名]</div>
</div>
</div>

</div>
</body>
</html>
